// ---- случайные числа с «зерном» (одинаковые при каждом запуске) ----
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mod=(a,n)=>((a%n)+n)%n;
function cv(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,w); c.height=Math.max(1,h); return c; }

// bb = рамка [x0,y0,x1,y1], paint = как нарисовать, anchors = где крепятся нити.
// Точка (0,0) — место крепления (основание или гвоздик).

function pin(g,x,y){ // латунный гвоздик
  g.fillStyle='#B8893A'; g.beginPath(); g.arc(x,y,4.6,0,7); g.fill();
  g.fillStyle='#E9C878'; g.beginPath(); g.arc(x-1.2,y-1.2,2,0,7); g.fill();
}
function blob(g,x,y,rx,ry,col){ g.fillStyle=col; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,7); g.fill(); }
// деталь-шарнир: круглая «шайба» сверху и сужение вниз — без острых углов
function limb(g,r,len,r2,col){
  g.fillStyle=col; g.beginPath(); g.arc(0,0,r,Math.PI,0);
  g.quadraticCurveTo(r*0.9,len*0.5,r2,len); g.arc(0,len,r2,0,Math.PI); g.quadraticCurveTo(-r*0.9,len*0.5,-r,0); g.fill();
}

  g.strokeStyle=C.birch; g.lineWidth=4; g.lineCap='round';

let R=1;
const PIECES={};
function makePiece(key, def, haze){
  const bb=def.bb, pad=20;
  const w=bb[2]-bb[0]+pad*2, h=bb[3]-bb[1]+pad*2;
  const Wp=Math.ceil(w*R), Hp=Math.ceil(h*R);
  const face=cv(Wp,Hp), f=face.getContext('2d');
  f.setTransform(R,0,0,R,(pad-bb[0])*R,(pad-bb[1])*R);
  def.paint(f);
  // волокна дерева и мазки — только внутри формы
  const r=rng(key.length*97+(bb[2]|0));
  f.globalCompositeOperation='source-atop';
  f.lineWidth=1.1;
  for(let y=bb[1]; y<bb[3]; y+=4+r()*6){
    f.strokeStyle='rgba(70,40,15,'+(0.03+r()*0.05).toFixed(3)+')';
    f.beginPath(); const ph=r()*6;
    for(let x=bb[0]; x<=bb[2]; x+=16) f.lineTo(x, y+Math.sin(x*0.025+ph)*1.6);
    f.stroke();
  }
  const area=(bb[2]-bb[0])*(bb[3]-bb[1]);
  for(let i=0;i<area/500;i++){
    f.fillStyle=r()<.5?'rgba(255,250,235,.06)':'rgba(40,20,0,.04)';
    f.beginPath(); f.ellipse(bb[0]+r()*(bb[2]-bb[0]), bb[1]+r()*(bb[3]-bb[1]), 4+r()*10, 2+r()*4, r()*3, 0, 7); f.fill();
  }
  if(haze){ f.globalAlpha=haze; f.fillStyle=BG; f.fillRect(bb[0]-5,bb[1]-5,w,h); f.globalAlpha=1; }
  f.globalCompositeOperation='source-over';
  const tint=(col)=>{ const c=cv(Wp,Hp), x=c.getContext('2d'); x.drawImage(face,0,0); x.globalCompositeOperation='source-in'; x.fillStyle=col; x.fillRect(0,0,Wp,Hp); return c; };
  const sil=tint('#000'), edge=tint(haze?'#E3DCC0':C.edge);
  const out=cv(Wp,Hp), o=out.getContext('2d');
  o.save(); o.shadowColor=haze?'rgba(60,70,60,.14)':'rgba(70,40,15,.30)'; o.shadowBlur=8*R;
  o.shadowOffsetX=10000+6*R; o.shadowOffsetY=5*R; o.drawImage(sil,-10000,0); o.restore();
  o.drawImage(edge,2.5*R,3*R);
  o.drawImage(face,0,0);
  PIECES[key]={img:out, ox:pad-bb[0], oy:pad-bb[1], w, h, bb};
}
function drawPiece(g,P){ g.drawImage(P.img,-P.ox,-P.oy,P.w,P.h); }

function vis(it){
  if(it.season!==undefined) return it.season===SEASON;
  const k=it.key;
  if(/^(daisy|poppy|corn)/.test(k)) return SEASON===0||SEASON===3;   // цветы — весной и летом
  if(k.startsWith('mush')) return SEASON<2;                          // грибы — летом и осенью
  return true;
}

const STRIP_IDS=['sky','bighills','hills','bgtrees','ground'], STRIPS={};
function period(id){ return id==='ground'?945:L*PL(id).p; }
function buildStrips(){
  for(const id of STRIP_IDS){
    const P=PL(id), s=P.s, per=period(id);
    let top=1e9, bot=-1e9;
    for(const it of ITEMS[id]){ const bb=PIECES[it.pk].bb, y0=P.dy+it.yo;
      top=Math.min(top,y0+bb[1]*s-25); bot=Math.max(bot,y0+bb[3]*s+25);
      if(DEF[it.key].anchors) top=Math.min(top,-base-30); }
    const Rs=Math.min(R,15000/per);
    const c=cv(Math.ceil(per*Rs),Math.ceil((bot-top)*Rs)), g=c.getContext('2d');
    g.lineWidth=1.4; g.strokeStyle='rgba(59,42,34,.5)';
    for(const it of ITEMS[id]) for(const k of [-1,0,1]){
      const ty=P.dy+it.yo-top;
      g.setTransform(Rs,0,0,Rs,(it.x+k*per)*Rs,ty*Rs);
      const an=DEF[it.key].anchors;
      if(an){ g.beginPath(); for(const a of an){ g.moveTo(a[0]*s,a[1]*s); g.lineTo(a[0]*s,-ty); } g.stroke(); }
      g.scale(s,s); drawPiece(g,PIECES[it.pk]);
    }
    STRIPS[id]={c,Rs,top,per};
  }
}
function drawStrip(id){
  const st=STRIPS[id], p=PL(id).p, per=st.per, h=st.c.height;
  const off=mod(-world*p,per);
  for(let dx=off-per; dx<W; dx+=per){
    const v0=Math.max(0,dx), v1=Math.min(W,dx+per); if(v1<=v0) continue;
    ctx.drawImage(st.c,(v0-dx)*st.Rs,0,(v1-v0)*st.Rs,h, v0,base+st.top, v1-v0,h/st.Rs);
  }
}
function resize(){
  const cw=innerWidth, ch=innerHeight;
  dpr=Math.min(2,window.devicePixelRatio||1);
  S=Math.min(ch/900,cw/700); W=cw/S; H=ch/S;
  cvs.width=Math.round(cw*dpr); cvs.height=Math.round(ch*dpr);
  base=Math.min(Math.max(H*0.5+230,H*0.64),H-110);
  const nr=clamp(S*dpr*1.2,1,3);
  if(!PIECES['foxBody|x'] || Math.abs(nr-R)>0.2){ R=nr; buildPieces(); }
  buildStrips();
}

// ================= ДВИЖЕНИЕ =================
const spring =e=>1-Math.exp(-4.2*e)*Math.cos(5.6*e);   // мягкая пружина
const springS=e=>1-Math.exp(-4.6*e)*Math.cos(5*e);
const smooth =q=>q*q*(3-2*q);

function itemX(it){ const pl=it.pl, Lp=L*pl.p; return mod(it.x-world*pl.p+M,Lp)-M; }
function drawItem(it,t){
  if(!vis(it)) return;
  const pl=it.pl, sx=itemX(it);
  if(sx>W+M-1) return;
  const P=PIECES[it.pk], s=pl.s, bb=P.bb;
  const y0 = it.yo==='sign' ? Math.max(76,base-660) : base+pl.dy+it.yo;
  let ox=0, oy=0, rot=0, sy=1;
  if(it.m==='none'){ rot=Math.sin(t*0.9+it.seed)*0.005; }
  else {
    const e=clamp((W+80-sx)/(W*0.34),0,1);
    const q=clamp((W*0.14-sx)/(W*0.26),0,1);
    if(e<=0||q>=1) return;
    const ex=smooth(q);
    if(it.m==='fly'){
      const D=y0+bb[3]*s+120;
      oy=-D*(1-springS(e))-D*ex;
      rot=0.03*Math.exp(-3*e)*Math.sin(9*e)+Math.sin(t*1.1+it.seed)*0.008;
    } else if(it.m==='trap'){
      const D=-bb[1]*s+12; oy=D*(1-spring(e))+D*ex;
    } else if(it.m==='slide'){
      ox=W*0.3*(1-spring(e))-W*0.3*ex;
      rot=0.02*Math.exp(-3*e)*Math.sin(10*e)+Math.sin(t*1.3+it.seed)*0.005;
    } else if(it.m==='hinge'){
      const a=(Math.PI/2)*(1-spring(e))+ex*(Math.PI/2);
      sy=Math.cos(clamp(a,-1.2,Math.PI/2)); if(sy<0.03) return;
    }
  }
  const X=sx+ox, Y=y0+oy;
  // нити крепятся к точкам внутри рисунка
  const an=DEF[it.key].anchors;
  if(an){
    const c=Math.cos(rot), sn=Math.sin(rot);
    ctx.strokeStyle='rgba(59,42,34,.5)'; ctx.lineWidth=1.4; ctx.beginPath();
    for(const a of an){ const lx=a[0]*s, ly=a[1]*s*sy, px=X+lx*c-ly*sn, py=Y+lx*sn+ly*c;
      if(py>-30){ ctx.moveTo(px,py); ctx.lineTo(px,-30); } }
    ctx.stroke();
  }
  ctx.save();
  if(it.m==='trap'){ ctx.beginPath(); ctx.rect(-M,-1e4,W+2*M,1e4+y0+2); ctx.clip(); }
  ctx.translate(X,Y); if(rot) ctx.rotate(rot); ctx.scale(s,s*sy);
  drawPiece(ctx,P);
  ctx.restore();
}
function part(key,x,y,a){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); drawPiece(ctx,PIECES[key+'|x']); ctx.restore(); }

// ================= ВОДА: сплошные ряды волн с круглыми берегами =================
// Три ряда качаются навстречу друг другу — как «волновая машина» в театре. Зимой — лёд.
const ROWS=[
  {pl:'mid',   by:6,   h:78, col:'#5B95B8', dark:'#4A82A6', ice:'#A8D2E6', ph:0},
  {pl:'mid',   by:42,  h:74, col:'#4A86AC', dark:'#3C7398', ice:'#92C4DC', ph:2.1},
  {pl:'front', by:108, h:80, col:'#3D78A0', dark:'#33698E', ice:'#7EB5D1', ph:4.2}
];
function drawWater(row,t){
  const P=PL(row.pl), p=P.p, Lp=L*p, x0=STREAM[0]*p, len=(STREAM[1]-STREAM[0])*p;
  const a=mod(x0-world*p+len+M,Lp)-len-M, b=a+len;
  if(a>W+M||b<-M) return null;
  const ice=PAL.ice;
  const sway=ice?0:Math.sin(t*1.1+row.ph)*12, bob=ice?0:Math.sin(t*1.6+row.ph)*6;
  const A=a+sway, B=b+sway, yb=base+row.by+bob, yt=yb-row.h, Rr=36, w=92;
  const path=new Path2D(); path.moveTo(A,yb+20); path.lineTo(A,yt+Rr); path.quadraticCurveTo(A,yt,A+Rr,yt);
  const crests=[];
  let k0=Math.max(0,Math.floor((-120-(A+Rr))/w)), x=A+Rr+k0*w;
  if(k0>0) path.lineTo(x,yt);
  const xEnd=Math.min(B-Rr,W+120);
  while(x<xEnd){ const nx=Math.min(x+w,B-Rr), cx=(x+nx)/2, ch=ice?yt:yt-16-5*Math.sin(t*2+x*0.05);
    path.quadraticCurveTo(cx,ch,nx,yt); crests.push([x,nx,ch]); x=nx; }
  path.lineTo(B-Rr,yt); path.quadraticCurveTo(B,yt,B,yt+Rr); path.lineTo(B,yb+20); path.closePath();
  ctx.save(); ctx.translate(6,5); ctx.fillStyle='rgba(30,60,80,.22)'; ctx.fill(path); ctx.restore();
  ctx.save(); ctx.translate(2.5,3); ctx.fillStyle=C.edge; ctx.fill(path); ctx.restore();
  ctx.fillStyle=ice?row.ice:row.col; ctx.fill(path);
  ctx.save(); ctx.clip(path);
  const x1=Math.max(A,-50), x2=Math.min(B,W+50);
  if(ice){
    // лёд: глянцевые косые блики, тёмные трещинки и снежная кромка сверху
    ctx.fillStyle='rgba(60,110,150,.18)'; ctx.fillRect(x1,yb-26,x2-x1,60);
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(let k=0;k<crests.length;k+=2){ const m=(crests[k][0]+crests[k][1])/2;
      ctx.beginPath(); ctx.moveTo(m-34,yt+row.h-14); ctx.lineTo(m-18,yt+row.h-14); ctx.lineTo(m+20,yt+12); ctx.lineTo(m+4,yt+12); ctx.fill(); }
    ctx.strokeStyle='rgba(40,85,120,.45)'; ctx.lineWidth=1.8; ctx.lineCap='round'; ctx.beginPath();
    for(const c of crests){ const m=c[0]+30; ctx.moveTo(m,yt+26); ctx.lineTo(m+22,yt+38); ctx.lineTo(m+14,yt+54); ctx.moveTo(m+22,yt+38); ctx.lineTo(m+44,yt+34); }
    ctx.stroke();
    ctx.fillStyle='#F6FAFC'; ctx.fillRect(x1,yt-1,x2-x1,6);
  } else {
    ctx.fillStyle=row.dark; ctx.fillRect(x1,yb-20,x2-x1,60);
    ctx.strokeStyle='rgba(225,244,248,.9)'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.beginPath();
    for(const c of crests){ const m=(c[0]+c[1])/2, d=(c[1]-c[0])*0.24; ctx.moveTo(m-d,yt-2); ctx.quadraticCurveTo(m,c[2]+12,m+d,yt-1); }
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(const c of crests){ const m=(c[0]+c[1])/2+Math.sin(t*3+c[0])*14; ctx.beginPath(); ctx.ellipse(m,yt+26,7,2.5,0,0,7); ctx.fill(); }
  }
  ctx.restore();
  return {A,B,yt,yb};
}

// ================= ЛИСА-МАРИОНЕТКА =================
let stepPrev=0, phase=0, jumpT=-1, jumpDur=0.8, jumpH=100, wagT=-1, wagNext=6;
function jump(dur,h){ if(jumpT<0){ jumpT=0; jumpDur=dur; jumpH=h; wagT=0; sfxJump(); } }
function foxX(){ return Math.max(W*0.42,345); }
function drawFox(t,dt){
  const fx=foxX();
  let jy=0, k=0;
  if(jumpT>=0){ jumpT+=dt; k=jumpT/jumpDur; if(k>=1){ jumpT=-1; k=0; } else jy=-Math.sin(Math.PI*k)*jumpH; }
  const jumping=jumpT>=0, tuck=jumping?Math.sin(Math.PI*k):0;
  phase+=dt*2*Math.PI*0.95*(jumping?0.3:1);
  const sv=Math.sin(phase); if(!jumping && sv*stepPrev<0) sfxStep(); stepPrev=sv;
  const sp=Math.sin(phase), A=0.42*(1-tuck);
  const bob=-Math.abs(Math.cos(phase))*7*(1-tuck);
  const by=base-122+bob+jy, tilt=Math.sin(phase*2)*0.025-tuck*0.12;
  ctx.fillStyle='rgba(70,40,15,'+(0.2*(1+jy/250)).toFixed(3)+')';
  ctx.beginPath(); ctx.ellipse(fx+8,base+4,125*(1+jy/400),11,0,0,7); ctx.fill();
  const sw=Math.sin(t*0.8)*12;
  ctx.strokeStyle='rgba(59,42,34,.45)'; ctx.lineWidth=1.3; ctx.beginPath();
  ctx.moveTo(fx+125,by-62); ctx.lineTo(fx+118+sw,-30);
  ctx.moveTo(fx-40,by-50); ctx.lineTo(fx-46+sw,-30); ctx.stroke();
  if(t>wagNext && wagT<0){ wagT=0; wagNext=t+6+Math.random()*5; }
  let wag=Math.sin(t*2.2)*0.12;
  if(wagT>=0){ wagT+=dt; if(wagT>1.6) wagT=-1; else wag+=Math.sin(wagT*16)*0.38*(1-wagT/1.6); }
  ctx.save(); ctx.translate(fx,by); ctx.rotate(tilt);
  part('foxLegF', 95,24, -A*sp-0.55*tuck);
  part('foxLegF',-75,22,  A*sp+0.55*tuck);
  part('foxTail',-122,-14, wag-0.1*tuck);
  drawPiece(ctx,PIECES['foxBody|x']);
  part('foxLegN', 80,28,  A*sp-0.6*tuck);
  part('foxLegN',-90,26, -A*sp+0.6*tuck);
  part('foxHead',118,-28, Math.sin(phase*2+0.6)*0.05-tuck*0.15);
  ctx.restore();
}
function autoJump(){
  const trig=foxX()+175;
  for(const it of ITEMS.mid){ if(it.key!=='stump') continue;
    const sx=itemX(it);
    if(it.prev!==undefined && it.prev>trig && sx<=trig) jump(2.0,125);
    it.prev=sx; }
}

// ================= ЖИВНОСТЬ =================
function nit(x1,y1){ ctx.strokeStyle='rgba(59,42,34,.45)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1+18,-30); ctx.stroke(); }

function drawAir(t,lp){        // птицы и бабочки — на нитках; возвращает число птиц
  let birds=0;
  for(const ev of EV){
    if((ev.k!=='bird'&&ev.k!=='bfly')||lp<ev.a||lp>ev.a+ev.d) continue;
    if(SEASON===2 && (ev.k==='bfly' || !ev.w)) continue;   // зимой бабочек нет, птиц меньше
    const pr=(lp-ev.a)/ev.d, ph=ev.a*0.01;
    if(ev.k==='bird'){
      const bx=W+90-pr*(W+180), by=base+ev.y+Math.sin(pr*Math.PI*4+ph)*22;
      birds++; nit(bx,by-10);
      ctx.save(); ctx.translate(bx,by); ctx.scale(ev.sc,ev.sc); ctx.rotate(Math.sin(t*3+ph)*0.06);
      part('birdWing'+ev.c,8,-8,Math.sin(t*13+ph)*0.75-0.2);
      drawPiece(ctx,PIECES['birdBody'+ev.c+'|x']);
      ctx.restore();
    } else {
      const bx=W+60-pr*(W+120), by=base+ev.y+Math.sin(pr*Math.PI*5+ph)*40;
      nit(bx,by-6);
      ctx.save(); ctx.translate(bx,by); ctx.scale(1.5*(0.25+0.75*Math.abs(Math.cos(t*12+ph))),1.5);
      drawPiece(ctx,PIECES['bfly'+ev.c+'|x']); ctx.restore();
    }
  }
  return birds;
}
function drawDuck(t,lp,row){
  if(!row||PAL.ice) return false;
  const X=9300-0.25*(lp-7000)-lp;
  if(lp<7000||X<row.A+60||X>row.B-60||X<-120||X>W+120) return false;
  const y=row.yt+16+Math.sin(t*1.6)*5;
  ctx.save(); ctx.beginPath(); ctx.rect(-M,-1e4,W+2*M,1e4+row.yt+14); ctx.clip();
  ctx.translate(X,y); ctx.scale(1.3,1.3); ctx.rotate(Math.sin(t*1.3)*0.06); drawPiece(ctx,PIECES['duck|x']);
  ctx.restore(); return true;
}
function drawLilies(t,row){
  if(!row||PAL.ice) return;
  [380,1050,1650].forEach((o,i)=>{ const x=row.A+o; if(x<-60||x>W+60||x>row.B-40) return;
    ctx.save(); ctx.translate(x,row.yt+8+Math.sin(t*1.4+i)*3); ctx.scale(1.1,1.1); drawPiece(ctx,PIECES['lily|x']); ctx.restore(); });
}
// рыбка: выпрыгивает из-за волны головой вперёд и ныряет обратно
function drawFish(t,lp,row){
  if(!row||PAL.ice) return;
  [600,1350].forEach((o,i)=>{
    const a=STREAM[0]+o-W*0.62-120*i, pr=(lp-a)/220;
    if(pr<0||pr>1) return;
    const jx=170, jh=140;
    const x=row.A+o+pr*jx, y=row.yt+45-Math.sin(Math.PI*pr)*jh;
    const ang=Math.atan2(-Math.PI*jh*Math.cos(Math.PI*pr), jx);   // направление полёта
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(-1.2,1.2);  // зеркалим: смотрит вперёд, спинка вверх
    drawPiece(ctx,PIECES['fish|x']); ctx.restore();
  });
}
// тележка-фурка: зверь стоит на ней и перебирает лапами, колёса крутятся
function drawCart(x,fb,s,dist){
  const y=fb-12*s;
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  drawPiece(ctx,PIECES['cart|x']);
  part('wheel',-62,0,dist/13); part('wheel',62,0,dist/13);
  ctx.restore();
  return y-26*s;                                   // верх доски
}
function drawRunners(t,lp){
  const s=PL('front').s, fb=base+PL('front').dy;
  for(const ev of EV){
    if(lp<ev.a||lp>ev.a+ev.d) continue;
    const pr=(lp-ev.a)/ev.d;
    if(ev.k==='hare'){
      const dir=ev.dir||-1, psi=pr*Math.PI*2*6, up=Math.max(0,Math.sin(psi));
      const hx=dir<0? W+150-pr*(W+300) : -150+pr*(W+300);
      const top=drawCart(hx,fb,s,pr*(W+300)/s);
      const hy=top-56*s-up*16;
      ctx.save(); ctx.translate(hx,hy); ctx.scale(-dir*s,s); ctx.rotate(-Math.cos(psi)*0.08);
      part('hareFront',-42,24,-Math.sin(psi)*0.5); part('hareTail',72,-14,0);
      drawPiece(ctx,PIECES['hareBody|x']);
      part('hareBack',44,12,Math.sin(psi)*0.5); part('hareHead',-56,-24,Math.sin(psi+1)*0.1);
      ctx.restore();
    } else if(ev.k==='hedge'){
      if(SEASON===2) continue;                       // зимой ёжик спит
      const st=pr*Math.PI*2*16, hs=s*1.25, hx=W+120-pr*(W+240);
      const top=drawCart(hx,fb,s,pr*(W+240)/s);
      const hy=top-24*hs-Math.abs(Math.sin(st))*3;
      ctx.save(); ctx.translate(hx,hy); ctx.scale(hs,hs);
      part('hedgeLeg',20,-4,-Math.sin(st)*0.5); part('hedgeLeg',-22,-4,Math.sin(st)*0.5);
      drawPiece(ctx,PIECES['hedgeBody|x']);
      part('hedgeLeg',28,-2,Math.sin(st)*0.5); part('hedgeLeg',-14,-2,-Math.sin(st)*0.5);
      ctx.restore();
    } else if(ev.k==='squ'){
      const psi=pr*Math.PI*2*8, up=Math.max(0,Math.sin(psi)), ss=s*1.2, hx=W+120-pr*(W+240);
      const top=drawCart(hx,fb,s,pr*(W+240)/s);
      const hy=top-26*ss-up*14;
      ctx.save(); ctx.translate(hx,hy); ctx.scale(ss,ss); ctx.rotate(-Math.cos(psi)*0.08);
      part('squTail',28,-6,Math.sin(psi)*0.2); part('squLeg',22,10,Math.sin(psi)*0.6);
      drawPiece(ctx,PIECES['squBody|x']); part('squLeg',-18,12,-Math.sin(psi)*0.5);
      ctx.restore();
    }
  }
}

function drawFloor(){

// ================= СУТКИ: небо, солнце, луна, звёзды =================
// u — доля круга (0..1). Ключевые точки: утро → день → вечер → ночь.
const DAYS=2;                                // сколько раз за круг сменяются сутки
// Сутки замкнуты в кольцо: значение в 1 совпадает с 0, поэтому скачков нет.
// 0 — поздняя ночь → рассвет → день → закат → сумерки → ночь → снова поздняя ночь.
const SKY=[[0,'#2A3560'],[0.05,'#7D7FA8'],[0.1,'#F6D3C2'],[0.2,'#BFE0EE'],[0.58,'#BFE0EE'],[0.68,'#F3B98E'],[0.77,'#5A5F8E'],[0.85,'#1F2B4E'],[0.95,'#1F2B4E'],[1,'#2A3560']];
const TINT=[[0,'#6A76A8'],[0.05,'#A9A6C8'],[0.1,'#FFE0D0'],[0.2,'#FFFFFF'],[0.58,'#FFFFFF'],[0.68,'#FFD2A8'],[0.77,'#8E8FC0'],[0.85,'#5D6AA0'],[0.95,'#5D6AA0'],[1,'#6A76A8']];
function hex(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function lerpKey(K,u){
  for(let i=1;i<K.length;i++) if(u<=K[i][0]){ const a=K[i-1], b=K[i], k=(u-a[0])/(b[0]-a[0]||1), A=hex(a[1]), B=hex(b[1]);
    return 'rgb('+A.map((v,j)=>Math.round(v+(B[j]-v)*k)).join(',')+')'; }
  return K[K.length-1][1];
}
const STARS=[]; (function(){ const r=rng(99); for(let i=0;i<70;i++) STARS.push([r(),r(),r()*6.28,1+r()*1.6]); })();
// насколько сейчас «ночь» (0..1): плавно нарастает в сумерках и плавно гаснет на рассвете
function night(u){ if(u>=0.72) return smooth(clamp((u-0.72)/0.13,0,1)); return smooth(clamp(1-u/0.1,0,1)); }
// солнце: встаёт из-за холмов справа, идёт дугой и садится за холмы слева
function drawSun(u,t){
  const p=(u-0.05)/0.75; if(p<0||p>1) return;
  const x=W*(0.9-0.8*p), y=base-220-380*Math.sin(Math.PI*p);
  ctx.strokeStyle='rgba(59,42,34,.5)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(x,y-38); ctx.lineTo(x,-30); ctx.stroke();

// ================= ЗАНАВЕС: смена акта (сезона) =================
// Порядок: занавес закрывается → сезон меняется → табличка опускается на верёвках →
// табличка поднимается → занавес медленно открывается.
const CLOSE0=L-780, CLOSE1=L-480;          // закрытие
const DOWN0=L-440, DOWN1=L-200;            // табличка опускается
const UP0=60, UP1=280;                     // табличка поднимается (уже в новом круге)
const OPEN0=240, OPEN1=920;                // открытие (~5 секунд)
let CURT=null;
function curtainTex(){
  const w=Math.ceil(W/2+60), h=Math.ceil(H+20), c=cv(Math.ceil(w*Math.min(R,1.5)),Math.ceil(h*Math.min(R,1.5))), g=c.getContext('2d');
  g.scale(c.width/w,c.height/h);
  const gr=g.createLinearGradient(0,0,w,0);
  for(let i=0;i<=12;i++){ gr.addColorStop(i/12, i%2?'#7E1F22':'#A8302F'); }
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  g.fillStyle='#D9A441'; g.fillRect(0,h-34,w,12);
  g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(0,h-22,w,22);
  return {c,w,h};
}
function curtainC(lp){
  if(lp>=CLOSE0 && lp<CLOSE1) return smooth((lp-CLOSE0)/(CLOSE1-CLOSE0));
  if(lp>=CLOSE1 || lp<OPEN0) return 1;
  if(lp<OPEN1) return 1-smooth((lp-OPEN0)/(OPEN1-OPEN0));
  return 0;
}
// кнопка «Дальше»: занавес закрывается прямо сейчас, потом — новый акт
let FORCED=-1;
function curtainNow(lp){ let c=curtainC(lp); if(FORCED>=0) c=Math.max(c,smooth(clamp(FORCED/1.4,0,1))); return c; }
function nextSeason(){ const lp=mod(world,L); if(FORCED<0 && lp>OPEN1 && lp<CLOSE0){ FORCED=0; } }
function drawCurtain(lp,t){
  const c=curtainNow(lp);
  if(c<=0) return;
  if(!CURT||CURT.w<W/2+60-1||CURT.h<H+20-1) CURT=curtainTex();
  const half=W/2+40, off=(1-c)*(half+20);
  ctx.drawImage(CURT.c,-40-off,-10,half+20,H+20);
  ctx.save(); ctx.translate(W+40+off,-10); ctx.scale(-1,1); ctx.drawImage(CURT.c,0,0,half+20,H+20); ctx.restore();
  // табличка акта: 0 — наверху (не видно), 1 — опущена
  let d=0;
  if(lp>=DOWN0) d=springS(clamp((lp-DOWN0)/(DOWN1-DOWN0),0,1));
  else if(lp<UP0) d=1;
  else if(lp<UP1) d=1-smooth((lp-UP0)/(UP1-UP0));
  if(d<=0) return;
  const sn=SEASONS[SEASON], bx=W/2, fy=Math.min(H*0.42,base-300), by=-120+(fy+120)*d;
  const rot=Math.sin(t*1.3)*0.015+(lp>=DOWN0?0.04*Math.exp(-3*(lp-DOWN0)/240)*Math.sin((lp-DOWN0)/14):0);
  ctx.strokeStyle='rgba(59,42,34,.6)'; ctx.lineWidth=1.6; ctx.beginPath();
  ctx.moveTo(bx-150,by-56); ctx.lineTo(bx-150,-30); ctx.moveTo(bx+150,by-56); ctx.lineTo(bx+150,-30); ctx.stroke();
  ctx.save(); ctx.translate(bx,by); ctx.rotate(rot);
  ctx.fillStyle='rgba(40,10,10,.3)'; ctx.beginPath(); ctx.roundRect(-204,-62,420,140,18); ctx.fill();
  ctx.fillStyle='#E2C08F'; ctx.beginPath(); ctx.roundRect(-207,-67,420,140,18); ctx.fill();
  ctx.fillStyle='#DDB57F'; ctx.beginPath(); ctx.roundRect(-210,-70,420,140,18); ctx.fill();
  ctx.strokeStyle='rgba(120,80,40,.45)'; ctx.lineWidth=3; ctx.beginPath(); ctx.roundRect(-198,-58,396,116,12); ctx.stroke();
  pin(ctx,-150,-56); pin(ctx,150,-56);
  ctx.fillStyle='#5A3A1E'; ctx.textAlign='center'; ctx.font='30px '+FONT; ctx.fillText(sn.act,0,-16);
  ctx.font='54px '+FONT; ctx.fillText(sn.name,0,42); ctx.textAlign='left';

// ================= АНОНС: птица несёт ленту «Скоро — Осень» =================

// сезон зависит от номера круга; меняется, когда занавес уже закрыт

// ================= ЗВУК: всё синтезируется в браузере, без файлов =================
// Музыка: у каждого сезона свой лад, аккорды и «инструмент». Природа: ветер, ручей, птицы и т. д.
const MUS=[
  {root:261.63, scale:[0,2,4,7,9],  chords:[[0,0],[9,1],[5,0],[7,0]], beat:0.72, voice:'warm'},   // лето: до мажор
  {root:220.00, scale:[0,3,5,7,10], chords:[[0,1],[8,0],[3,0],[10,0]], beat:0.9, voice:'soft'},   // осень: ля минор
  {root:293.66, scale:[0,2,3,7,9],  chords:[[0,1],[8,0],[3,0],[10,0]], beat:0.95, voice:'bell'},  // зима: шкатулка
  {root:392.00, scale:[0,2,4,7,9],  chords:[[0,0],[9,1],[5,0],[7,0]], beat:0.6, voice:'flute'}    // весна: соль мажор
];
const SND={on:false, duck:false, birds:0, water:false, foxWater:false};
let AC=null, master, comp, musicBus, sfxBus, verb, streamG, streamF, NOISE;
let nextGust=0;
let nextBubble=0, streamAmt=0;
let nextBeat=0, beat=0, mel=5, nextChirp=0, nextCricket=0, nextOwl=0, nextQuack=0, nextPecker=0, prevC=1;
function impulse(sec){ const n=AC.sampleRate*sec, b=AC.createBuffer(2,n,AC.sampleRate);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6); } return b; }
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
  comp=AC.createDynamicsCompressor(); comp.connect(master);
  verb=AC.createConvolver(); verb.buffer=impulse(3.2); const vg=AC.createGain(); vg.gain.value=0.45; verb.connect(vg); vg.connect(comp);
  musicBus=AC.createGain(); musicBus.gain.value=0.32; musicBus.connect(comp); musicBus.connect(verb);
  sfxBus=AC.createGain(); sfxBus.gain.value=0.7; sfxBus.connect(comp); const sv=AC.createGain(); sv.gain.value=0.25; sfxBus.connect(sv); sv.connect(verb);
  NOISE=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  // ветер и ручей — бесконечный шум через фильтры
  const loop=(f,q,type)=>{ const src=AC.createBufferSource(); src.buffer=NOISE; src.loop=true;
    const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q; const g=AC.createGain(); g.gain.value=0;
    src.connect(fl); fl.connect(g); g.connect(comp); src.start(); return {g,fl}; };
  const st=loop(600,0.9,'lowpass'); streamG=st.g; streamF=st.fl;
  nextBeat=AC.currentTime+0.3;
}
function env(g,t,peak,a,hold,r){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.setValueAtTime(peak,t+a+hold); g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+r); }
function tone(f,t,{type='sine',g=0.1,a=0.02,hold=0.2,r=0.4,dest=musicBus,vib=0,f2=0}={}){
  const o=AC.createOscillator(), e=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+a+hold);
  if(vib){ const l=AC.createOscillator(), lg=AC.createGain(); l.frequency.value=5; lg.gain.value=f*0.007*vib; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+a+hold+r+0.1); }
  env(e,t,g,a,hold,r); o.connect(e); e.connect(dest); o.start(t); o.stop(t+a+hold+r+0.05);
}
function noiseHit(t,{f=1500,q=1,g=0.1,a=0.005,hold=0.01,r=0.08,type='bandpass',dest=sfxBus,f2=0}={}){
  const s2=AC.createBufferSource(); s2.buffer=NOISE; const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); fl.Q.value=q;
  if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+a+hold+r);
  const e=AC.createGain(); env(e,t,g,a,hold,r); s2.connect(fl); fl.connect(e); e.connect(dest); s2.start(t,Math.random()); s2.stop(t+a+hold+r+0.05);
}
const hz=(root,semi)=>root*Math.pow(2,semi/12);
function playBeat(t,n){
  const m=MUS[SEASON], bar=Math.floor(beat/8)%4, ch=m.chords[bar];
  if(beat%8===0){                       // мягкий аккорд-подушка и бас
    const iv=[0,ch[1]?3:4,7], len=m.beat*8;
    iv.forEach(x=>tone(hz(m.root,ch[0]+x-12),t,{type:'triangle',g:0.035,a:1.6,hold:len-1.6,r:2.5}));
    tone(hz(m.root,ch[0]-24),t,{type:'sine',g:0.06,a:0.8,hold:len-0.8,r:2});
  }
  if(Math.random()<(0.55-0.25*n)){       // мелодия: шаг по ладу вверх-вниз
    mel=clamp(mel+[-2,-1,-1,1,1,2][Math.random()*6|0],0,9);
    const sc=m.scale, semi=sc[mel%5]+12*Math.floor(mel/5), f=hz(m.root,semi);
    if(m.voice==='bell'){ [[1,1,2.2],[2.76,0.3,1.2],[5.4,0.12,0.6]].forEach(p=>tone(f*p[0],t,{g:0.06*p[1],a:0.004,hold:0.01,r:p[2]})); }
    else if(m.voice==='flute') tone(f,t,{g:0.07,a:0.07,hold:m.beat*0.9,r:0.5,vib:1});
    else if(m.voice==='soft')  tone(f/2,t,{g:0.08,a:0.12,hold:m.beat*1.1,r:1.0,vib:0.5});
    else tone(f,t,{type:'triangle',g:0.06,a:0.03,hold:m.beat*0.8,r:0.7});
  }
}
// ---- голоса природы ----
function chirp(t){ const k=2+(Math.random()*3|0), b=2600+Math.random()*1600;
  for(let i=0;i<k;i++) tone(b*(1+Math.random()*0.15),t+i*0.11,{g:0.035,a:0.005,hold:0.04,r:0.05,dest:sfxBus,f2:b*1.35}); }
// пузырёк ручья: короткий тон, который быстро «поднимается» вверх
function bubble(t,amt){ const f=420+Math.random()*900;
  tone(f,t,{g:(0.012+Math.random()*0.022)*amt,a:0.004,hold:0.012,r:0.05,dest:sfxBus,f2:f*(1.5+Math.random()*0.6)}); }
// шаги лисы: всплеск по воде, стук по льду, хруст по снегу
function sfxStep(){
  if(!SND.on||!AC) return; const t=AC.currentTime+0.01;
  if(SND.foxWater && !PAL.ice){ noiseHit(t,{f:1400,q:0.9,g:0.09,a:0.004,hold:0.02,r:0.16,f2:500});
    for(let i=0;i<3;i++) bubble(t+0.03+i*0.035+Math.random()*0.02,1.6); }
  else if(SND.foxWater && PAL.ice){ noiseHit(t,{f:3200,q:3,g:0.05,r:0.05}); tone(1800+Math.random()*400,t,{g:0.012,a:0.002,hold:0.01,r:0.12,dest:sfxBus}); }
  else if(PAL.snow){ noiseHit(t,{type:'lowpass',f:900,q:0.7,g:0.06,a:0.01,hold:0.04,r:0.08}); }
}
// порыв ветра: мягкий «вздох» воздуха + шелест травы короткими крупинками звука
function gust(t){
  const dur=2.6+Math.random()*1.6, k=[0.7,1,0.85,0.75][SEASON];
  // «вздох»: низкий шум, фильтр плавно поднимается и опускается
  const src=AC.createBufferSource(); src.buffer=NOISE; src.loop=true;
  const fl=AC.createBiquadFilter(); fl.type='bandpass'; fl.Q.value=0.7;
  fl.frequency.setValueAtTime(250,t); fl.frequency.linearRampToValueAtTime(700,t+dur*0.45); fl.frequency.linearRampToValueAtTime(260,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.02*k,t+dur*0.4); g.gain.linearRampToValueAtTime(0.0001,t+dur);
  src.connect(fl); fl.connect(g); g.connect(sfxBus); src.start(t,Math.random()); src.stop(t+dur+0.1);
  // шелест: много коротких тихих «шорохов» на высоких частотах, гуще в середине порыва
  const n=Math.round(38*dur*k);
  for(let i=0;i<n;i++){
    const x=Math.random(), shape=Math.sin(Math.PI*x);          // середина порыва — гуще и громче
    if(Math.random()>shape) continue;
    noiseHit(t+x*dur,{f:2600+Math.random()*3400,q:1.4,g:(0.006+Math.random()*0.012)*shape*k,a:0.004,hold:0.006,r:0.035});
  }
}
function cricket(t,g){ for(let i=0;i<3;i++) tone(4300,t+i*0.06,{g:0.018*g,a:0.004,hold:0.02,r:0.02,dest:sfxBus}); }
function owl(t){ tone(392,t,{g:0.06,a:0.08,hold:0.18,r:0.25,dest:sfxBus,f2:370}); tone(370,t+0.55,{g:0.06,a:0.1,hold:0.4,r:0.35,dest:sfxBus,f2:330}); }
function quack(t){ for(let i=0;i<2;i++){ const o=AC.createOscillator(), fl=AC.createBiquadFilter(), e=AC.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(270,t+i*0.22); o.frequency.exponentialRampToValueAtTime(190,t+i*0.22+0.16);
  fl.type='bandpass'; fl.frequency.value=950; fl.Q.value=3; env(e,t+i*0.22,0.07,0.01,0.1,0.06);
  o.connect(fl); fl.connect(e); e.connect(sfxBus); o.start(t+i*0.22); o.stop(t+i*0.22+0.25); } }
function pecker(t){ for(let i=0;i<9;i++) noiseHit(t+i*0.055,{f:1700,q:6,g:0.09,r:0.04}); }
function sfxJump(){ if(!SND.on) return; const t=AC.currentTime; noiseHit(t,{f:900,q:3,g:0.12,r:0.06}); tone(300,t+0.02,{g:0.06,a:0.01,hold:0.08,r:0.15,dest:sfxBus,f2:520}); }
function sfxSwish(){ if(!SND.on) return; noiseHit(AC.currentTime,{type:'lowpass',f:300,f2:2400,q:0.7,g:0.08,a:0.6,hold:0.4,r:1.2}); }
// ---- каждый кадр: планируем музыку и природу ----
function soundFrame(lp,u,c){
  if(c>0 && prevC===0) sfxSwish();                 // занавес начал закрываться
  if(c<1 && prevC>=1) sfxSwish();     // занавес начал открываться
  prevC=c;
  if(!SND.on||!AC) return;
  const now=AC.currentTime, n=night(u), m=MUS[SEASON];
  musicBus.gain.setTargetAtTime(0.32*(1-0.35*n),now,0.5);
  while(nextBeat<now+0.25){ playBeat(Math.max(nextBeat,now),n); nextBeat+=m.beat; beat++; }
  // ветер: только редкие порывы с шелестом травы (без постоянного шума)
  if(c<1 && now>nextGust){ if(nextGust>0) gust(now+0.05); nextGust=now+[11,8,9,12][SEASON]+Math.random()*7; }
  // журчание: только когда ручей уже на экране и не замёрз
  const wantStream=SND.water&&!PAL.ice&&c<1?1:0;
  streamAmt+=(wantStream-streamAmt)*0.03;
  streamG.gain.setTargetAtTime(0.05*streamAmt,now,0.3);
  streamF.frequency.setTargetAtTime(480+260*Math.sin(time*1.7)+160*Math.sin(time*4.3),now,0.1);
  if(streamAmt>0.05){ if(nextBubble<now) nextBubble=now;
    while(nextBubble<now+0.2){ bubble(nextBubble,streamAmt); nextBubble+=0.03+Math.random()*0.09; } }
  if(c>=1) return;
  if(SND.birds>0 && n<0.4 && now>nextChirp){ chirp(now+0.05); nextChirp=now+(0.8+Math.random()*2.4)*(SEASON===2?2:1); }
  if(SEASON===0 && n>0.5 && now>nextCricket){ cricket(now+0.02,n); nextCricket=now+0.45+Math.random()*0.3; }
  if(n>0.7 && now>nextOwl){ if(nextOwl>0) owl(now+0.1); nextOwl=now+8+Math.random()*6; }
  if(SND.duck && now>nextQuack){ if(nextQuack>0) quack(now+0.05); nextQuack=now+3+Math.random()*4; }
  if(SEASON!==2 && n<0.4 && lp>2700 && lp<5400 && now>nextPecker){ if(nextPecker>0) pecker(now+0.05); nextPecker=now+6+Math.random()*5; }
}
function setSound(on){
  if(!AC) initAudio();
  SND.on=on;
  if(on){ AC.resume(); nextBeat=AC.currentTime+0.2; master.gain.setTargetAtTime(0.9,AC.currentTime,0.6); }
  else { master.gain.setTargetAtTime(0,AC.currentTime,0.25); setTimeout(()=>{ if(!SND.on) AC.suspend(); },900); }
  const b=document.getElementById('bSound'); b.textContent=on?'♪ Выключить звук':'♪ Включить звук'; b.setAttribute('aria-pressed',on);
}
document.addEventListener('visibilitychange',()=>{ if(!AC||!SND.on) return; if(document.hidden) AC.suspend(); else AC.resume(); });

// ---- кнопки ----
const bNext=document.getElementById('bNext');
let uiLabel='';
function updateUI(lp){
  const lab='Дальше: '+SEASONS[(SEASON+1)%4].name+' →';
  if(lab!==uiLabel){ bNext.textContent=lab; uiLabel=lab; }
  if(lp!==undefined){ const busy=FORCED>=0 || !(lp>OPEN1 && lp<CLOSE0); if(bNext.disabled!==busy) bNext.disabled=busy; }
}
document.getElementById('bSound').addEventListener('click',()=>setSound(!SND.on));
bNext.addEventListener('click',nextSeason);

// ================= ГЛАВНЫЙ ЦИКЛ =================
let world=-180, last=performance.now(), time=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  time+=dt; world+=SPEED*dt;                 // скорость не зависит от устройства
  if(FORCED>=0){ FORCED+=dt; if(FORCED>=1.4){ world=Math.floor(world/L)*L+CLOSE1+2; FORCED=-1; } }
  const sn=seasonFor(world); if(sn!==SEASON) setSeason(sn);
  const lp=mod(world,L), u=mod(lp/L*DAYS,1);   // u — время суток
  const cNow=curtainNow(lp);
  soundFrame(lp,u,cNow);
  updateUI(lp);
  ctx.setTransform(S*dpr,0,0,S*dpr,0,0);
  ctx.globalCompositeOperation='source-over';
  if(cNow>=1){ drawCurtain(lp,time); window.__frames=(window.__frames||0)+1; requestAnimationFrame(frame); return; }  // за закрытым занавесом сцену не рисуем
  ctx.fillStyle=lerpKey(SKY,u); ctx.fillRect(-10,-10,W+20,H+20);
  drawStrip('sky');
  drawSun(u,time);
  drawStrip('bighills');
  drawFloor();
  drawStrip('hills');
  drawStrip('bgtrees');
  for(const it of ITEMS.far) drawItem(it,time);
  for(const it of ITEMS.mid) drawItem(it,time);
  const r1=drawWater(ROWS[0],time);
  SND.duck=drawDuck(time,lp,r1);
  SND.birds=drawAir(time,lp);
  SND.water=!!r1 && r1.A<W*0.9 && r1.B>W*0.1;
  autoJump();
  drawFox(time,dt);
  drawFish(time,lp,r1);
  const r2=drawWater(ROWS[1],time);
  SND.foxWater=!!r2 && foxX()>r2.A+30 && foxX()<r2.B-30;
  drawLilies(time,r2);
  drawRunners(time,lp);
  for(const it of ITEMS.front) drawItem(it,time);
  drawWater(ROWS[2],time);
  drawStrip('ground');
  drawFall(time,PAL.fall,1);
  drawFall(time,SEASONS[(SEASON+1)%4].fall,clamp((lp-7600)/(CLOSE0-7600),0,1)*0.35*(lp<CLOSE1?1:0));
  // освещение времени суток: умножаем цвета на оттенок (утро — розовое, вечер — оранжевое, ночь — синяя)
  const tint=lerpKey(TINT,u);
  if(tint!=='rgb(255,255,255)'){ ctx.globalCompositeOperation='multiply'; ctx.fillStyle=tint; ctx.fillRect(-10,-10,W+20,H+20); ctx.globalCompositeOperation='source-over'; }
  drawNight(u,time);
  drawFireflies(u,time);
  for(const it of ITEMS.signs) drawItem(it,time);   // указатели читаются в любое время суток
  drawAnnounce(lp,time);
  drawCurtain(lp,time);
  window.__frames=(window.__frames||0)+1;
  requestAnimationFrame(frame);
}

// запуск: ждём шрифт для указателей (но не дольше 1.5 секунды)
let started=false;
function start(){ if(started) return; started=true; resize(); requestAnimationFrame(frame); }
let rzT; addEventListener('resize',()=>{ if(!started) return; clearTimeout(rzT); rzT=setTimeout(()=>{ CURT=null; resize(); },150); });
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('30px Pangolin','Привет'),document.fonts.load('30px Pangolin','Hi')])
    .then(()=>{ if(started){ buildPieces(); buildStrips(); } else start(); }, start);
  setTimeout(start,1500);
} else start();

// клик или касание — лиса подпрыгивает и машет хвостом
cvs.addEventListener('pointerdown',()=>jump(0.8,100));
window.__seek=v=>{ world=v; };
</script>
